name: Publish n8n-nodes-globiguard

on:
  push:
    tags:
      - 'n8n-v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: test "n8n-v$(node -p "require('./packages/n8n-nodes-globiguard/package.json').version")" = "$GITHUB_REF_NAME"

      - name: Verify
        run: |
          pnpm --filter n8n-nodes-globiguard typecheck
          pnpm --filter n8n-nodes-globiguard lint
          pnpm --filter n8n-nodes-globiguard test
          pnpm --filter n8n-nodes-globiguard build
          test -f packages/n8n-nodes-globiguard/dist/credentials/GlobiGuardApi.credentials.js
          git ls-files --error-unmatch packages/n8n-nodes-globiguard/dist/credentials/GlobiGuardApi.credentials.js
          git ls-files --error-unmatch packages/n8n-nodes-globiguard/dist/nodes/GlobiGuard/GlobiGuard.node.js

      - name: Publish with npm provenance
        run: pnpm --filter n8n-nodes-globiguard release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
