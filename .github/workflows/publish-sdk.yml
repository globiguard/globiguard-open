name: Publish @globiguard/sdk

permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - 'sdk-v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package
        shell: bash
        run: |
          test "sdk-v$(node -p "require('./packages/sdk/package.json').version")" = "$GITHUB_REF_NAME"
          pnpm --filter @globiguard/sdk typecheck
          pnpm --filter @globiguard/sdk test
          pnpm --filter @globiguard/sdk build
          node scripts/verify-packed-sdk-consumer.mjs

      - name: Publish with npm provenance
        run: pnpm --filter @globiguard/sdk publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
