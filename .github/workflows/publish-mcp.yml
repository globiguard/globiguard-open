name: Publish @globiguard/mcp-server

on:
  push:
    tags:
      - 'mcp-v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: test "mcp-v$(node -p "require('./packages/mcp-server/package.json').version")" = "$GITHUB_REF_NAME"

      - name: Verify
        run: |
          pnpm --filter @globiguard/mcp-server typecheck
          pnpm --filter @globiguard/mcp-server test
          pnpm --filter @globiguard/mcp-server build

      - name: Publish with npm provenance
        run: pnpm --filter @globiguard/mcp-server publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
